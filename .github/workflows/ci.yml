name: CI

# 离线回归：不需要 DSH / SnowLuma / QQ，也不读取生产 config.json 或 state/。
# Node 24 是主目标（node:sqlite 已在 24 稳定可用）；Node 22 作为兼容性观察任务，
# 失败不阻断（22.x 的 node:sqlite 仍是实验特性，必要时用 --experimental-sqlite）。

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (Windows / Node 24)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Config schema is up to date
        run: node scripts/build-config-schema.mjs --check
      - name: Core reliability tests
        run: npm run test:core
      - name: Stage 2 tests
        run: npm run test:stage2
      - name: Stage 3 tests
        run: npm run test:stage3
      - name: Stage 4 tests
        run: npm run test:stage4
      - name: Offline audit suite
        run: npm run test:audit
        env:
          QQ_BRIDGE_TEST_LIVE: '0'
      - name: Privacy scan
        run: node scripts/privacy-scan.mjs

  node22:
    name: compatibility (Windows / Node 22, advisory)
    runs-on: windows-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Core reliability tests
        run: npm run test:core
        env:
          NODE_OPTIONS: --experimental-sqlite
      - name: Offline audit suite
        run: npm run test:audit
        env:
          NODE_OPTIONS: --experimental-sqlite
          QQ_BRIDGE_TEST_LIVE: '0'
