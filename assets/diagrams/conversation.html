<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>小鲸鱼 · 一条消息怎么走完</title>
<style>
  :root {
    --ink: #eef2ff;
    --muted: #a3b1d6;
    --faint: #6b7aa8;
    --teal: #7c93ff;
    --line: rgba(124, 147, 255, .24);
    --panel: rgba(15, 23, 54, .80);
    --panel-2: rgba(7, 12, 32, .88);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    width: 1600px;
    min-height: 940px;
    padding: 52px 64px 40px;
    font-family: "Microsoft YaHei", "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", sans-serif;
    color: var(--ink);
    background:
      radial-gradient(1000px 500px at 12% -8%, rgba(29, 55, 160, .32), transparent 60%),
      radial-gradient(820px 460px at 95% 0%, rgba(77, 107, 254, .20), transparent 58%),
      linear-gradient(180deg, #060b1c 0%, #0b1230 52%, #070c20 100%);
  }
  body::before {
    content: "";
    position: fixed; inset: 0;
    background-image:
      linear-gradient(rgba(160, 178, 255, .04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(160, 178, 255, .04) 1px, transparent 1px);
    background-size: 40px 40px;
    mask-image: linear-gradient(180deg, rgba(0,0,0,.65), rgba(0,0,0,.1));
    pointer-events: none;
  }
  .canvas { position: relative; }
  .head { display: flex; align-items: flex-end; justify-content: space-between; margin-bottom: 26px; }
  .kicker {
    font-family: "Cascadia Mono", Consolas, monospace;
    font-size: 13px; letter-spacing: .34em; text-transform: uppercase;
    color: var(--teal); margin: 0 0 10px;
  }
  h1 { font-size: 42px; margin: 0 0 8px; line-height: 1.1; }
  .sub { margin: 0; color: var(--muted); font-size: 17px; }
  .local {
    display: flex; align-items: center; gap: 9px;
    border: 1px solid var(--line); border-radius: 999px;
    padding: 8px 15px; font-size: 12.5px; color: #ccd8ff;
    background: rgba(124, 147, 255, .07);
  }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--teal); box-shadow: 0 0 10px var(--teal); }
  svg.flow { display: block; width: 100%; height: auto; }
  .legend {
    display: flex; align-items: center; justify-content: space-between;
    margin-top: 16px; padding-top: 16px;
    border-top: 1px solid rgba(160, 178, 255, .1);
    color: var(--muted); font-size: 13.5px;
  }
  .key { display: flex; align-items: center; gap: 22px; }
  .key span { display: inline-flex; align-items: center; gap: 9px; }
  .swatch { display: inline-block; width: 34px; height: 0; border-top: 2px solid #93a7ff; }
  .swatch.dash { border-top-style: dashed; border-color: #6f83c9; }
  .legend .mark { color: var(--faint); font-family: "Cascadia Mono", Consolas, monospace; letter-spacing: .16em; font-size: 11.5px; }
  text { font-family: "Microsoft YaHei", "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", sans-serif; }
  .mono { font-family: "Cascadia Mono", Consolas, monospace; }
  .signal { font-size: 17px; fill: #cfdafc; paint-order: stroke; stroke: #0a1128; stroke-width: 7px; stroke-linejoin: round; }
  .signal-soft { fill: #b9c6ea; }
  .num { font-family: "Cascadia Mono", Consolas, monospace; font-size: 12px; fill: #dbe4ff; }
  .card-title { font-size: 21px; fill: #eef2ff; font-weight: 600; }
  .card-sub { font-size: 12.5px; fill: #8fa2cf; }
</style>
</head>
<body data-lang="zh">
<div class="canvas">
  <header class="head">
    <div>
      <p class="kicker" data-en="CONVERSATION TRACE">对话链路</p>
      <h1 data-en="Six hops, one reply">一条消息，六步走完</h1>
      <p class="sub" data-en="From a friend hitting send to the reply showing up in QQ — every hop stays on your own machine.">群友按下发送之后，消息经过的每一跳都在你自己的机器上。</p>
    </div>
    <div class="local"><span class="dot"></span><span data-en="All local">全程本地</span></div>
  </header>

  <svg class="flow" viewBox="0 0 1472 660" role="img" aria-label="一次对话的六步链路：群友、SnowLuma、小鲸鱼桥接、DSH agent">
    <defs>
      <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#141f46" stop-opacity=".96"/>
        <stop offset="1" stop-color="#080d22" stop-opacity=".96"/>
      </linearGradient>
      <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M0,0 L10,5 L0,10 Z" fill="#93a7ff"/>
      </marker>
      <marker id="arrow-soft" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M0,0 L10,5 L0,10 Z" fill="#6f83c9"/>
      </marker>
    </defs>

    <!-- 你自己的机器 -->
    <rect x="424" y="80" width="1046" height="452" rx="18" fill="rgba(124,147,255,.035)" stroke="rgba(124,147,255,.18)" stroke-dasharray="7 9"/>
    <text x="446" y="518" class="mono" font-size="12" letter-spacing=".2em" fill="#6f83c9" data-en="YOUR OWN MACHINE">你自己的机器</text>

    <!-- lifelines -->
    <line x1="160" y1="62" x2="160" y2="560" stroke="rgba(124,147,255,.20)" stroke-width="2" stroke-dasharray="3 7"/>
    <line x1="560" y1="62" x2="560" y2="560" stroke="rgba(124,147,255,.20)" stroke-width="2" stroke-dasharray="3 7"/>
    <line x1="960" y1="62" x2="960" y2="560" stroke="rgba(124,147,255,.20)" stroke-width="2" stroke-dasharray="3 7"/>
    <line x1="1360" y1="62" x2="1360" y2="560" stroke="rgba(124,147,255,.20)" stroke-width="2" stroke-dasharray="3 7"/>

    <!-- activation bars -->
    <rect x="954" y="186" width="12" height="234" rx="6" fill="rgba(124,147,255,.16)" stroke="rgba(124,147,255,.42)"/>
    <rect x="1354" y="252" width="12" height="84" rx="6" fill="rgba(124,147,255,.16)" stroke="rgba(124,147,255,.42)"/>

    <!-- top cards -->
    <rect x="45" y="0" width="230" height="62" rx="14" fill="url(#card)" stroke="rgba(124,147,255,.28)"/>
    <text x="160" y="29" text-anchor="middle" class="card-title" data-en="Group member">群友</text>
    <text x="160" y="47" text-anchor="middle" class="card-sub" data-en="the human side">人的一侧</text>

    <rect x="445" y="0" width="230" height="62" rx="14" fill="url(#card)" stroke="rgba(124,147,255,.28)"/>
    <text x="560" y="29" text-anchor="middle" class="card-title">SnowLuma</text>
    <text x="560" y="47" text-anchor="middle" class="card-sub" data-en="OneBot v11 gateway">OneBot v11 网关</text>

    <rect x="845" y="0" width="230" height="62" rx="14" fill="url(#card)" stroke="rgba(124,147,255,.28)"/>
    <text x="960" y="29" text-anchor="middle" class="card-title" data-en="Xiaojingyu bridge">小鲸鱼桥接</text>
    <text x="960" y="47" text-anchor="middle" class="card-sub" data-en="dedupe · auth · audit">去重 · 鉴权 · 审计</text>

    <rect x="1245" y="0" width="230" height="62" rx="14" fill="url(#card)" stroke="rgba(124,147,255,.28)"/>
    <text x="1360" y="29" text-anchor="middle" class="card-title">DSH agent</text>
    <text x="1360" y="47" text-anchor="middle" class="card-sub" data-en="her brain and sessions">她的大脑与会话</text>

    <!-- 1 群友 -> SnowLuma -->
    <line x1="160" y1="120" x2="542" y2="120" stroke="#6f83c9" stroke-width="2" stroke-dasharray="7 7" marker-end="url(#arrow-soft)"/>
    <text x="368" y="102" text-anchor="middle" class="signal signal-soft" data-en="speaks in the group">在群里说话</text>
    <circle cx="188" cy="120" r="12" fill="#0b1230" stroke="#5c74c9" stroke-width="1.5"/>
    <text x="188" y="124" text-anchor="middle" class="num">1</text>

    <!-- 2 SnowLuma -> 桥接 -->
    <line x1="560" y1="186" x2="950" y2="186" stroke="#6f83c9" stroke-width="2" stroke-dasharray="7 7" marker-end="url(#arrow-soft)"/>
    <text x="768" y="168" text-anchor="middle" class="signal signal-soft" data-en="OneBot v11 event">OneBot v11 事件</text>
    <circle cx="588" cy="186" r="12" fill="#0b1230" stroke="#5c74c9" stroke-width="1.5"/>
    <text x="588" y="190" text-anchor="middle" class="num">2</text>

    <!-- 3 桥接 -> DSH -->
    <line x1="966" y1="252" x2="1342" y2="252" stroke="#93a7ff" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="1160" y="234" text-anchor="middle" class="signal" data-en="delivered to that group's DSH session">投递到该群的 DSH 会话</text>
    <circle cx="994" cy="252" r="12" fill="#0b1230" stroke="#5c74c9" stroke-width="1.5"/>
    <text x="994" y="256" text-anchor="middle" class="num">3</text>

    <!-- 4 DSH -> 桥接 -->
    <line x1="1354" y1="336" x2="974" y2="336" stroke="#93a7ff" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="1164" y="300" text-anchor="middle" class="signal" font-size="15.5" data-en="calls qq_get_unread_messages">调用 qq_get_unread_messages</text>
    <text x="1164" y="322" text-anchor="middle" class="signal" font-size="15.5" data-en="and qq_send_message">与 qq_send_message</text>
    <circle cx="1326" cy="336" r="12" fill="#0b1230" stroke="#5c74c9" stroke-width="1.5"/>
    <text x="1326" y="340" text-anchor="middle" class="num">4</text>

    <!-- 5 桥接 -> SnowLuma -->
    <line x1="954" y1="420" x2="578" y2="420" stroke="#93a7ff" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="768" y="402" text-anchor="middle" class="signal" data-en="whitelist check + audit, then send">白名单校验 + 审计后发送</text>
    <circle cx="926" cy="420" r="12" fill="#0b1230" stroke="#5c74c9" stroke-width="1.5"/>
    <text x="926" y="424" text-anchor="middle" class="num">5</text>

    <!-- 6 SnowLuma -> 群友 -->
    <line x1="560" y1="486" x2="178" y2="486" stroke="#6f83c9" stroke-width="2" stroke-dasharray="7 7" marker-end="url(#arrow-soft)"/>
    <text x="368" y="468" text-anchor="middle" class="signal signal-soft" data-en="reply appears in QQ">QQ 里出现回复</text>
    <circle cx="532" cy="486" r="12" fill="#0b1230" stroke="#5c74c9" stroke-width="1.5"/>
    <text x="532" y="490" text-anchor="middle" class="num">6</text>

    <!-- bottom cards -->
    <rect x="45" y="560" width="230" height="62" rx="14" fill="url(#card)" stroke="rgba(124,147,255,.28)"/>
    <text x="160" y="589" text-anchor="middle" class="card-title" data-en="Group member">群友</text>
    <text x="160" y="607" text-anchor="middle" class="card-sub" data-en="the human side">人的一侧</text>

    <rect x="445" y="560" width="230" height="62" rx="14" fill="url(#card)" stroke="rgba(124,147,255,.28)"/>
    <text x="560" y="589" text-anchor="middle" class="card-title">SnowLuma</text>
    <text x="560" y="607" text-anchor="middle" class="card-sub" data-en="OneBot v11 gateway">OneBot v11 网关</text>

    <rect x="845" y="560" width="230" height="62" rx="14" fill="url(#card)" stroke="rgba(124,147,255,.28)"/>
    <text x="960" y="589" text-anchor="middle" class="card-title" data-en="Xiaojingyu bridge">小鲸鱼桥接</text>
    <text x="960" y="607" text-anchor="middle" class="card-sub" data-en="dedupe · auth · audit">去重 · 鉴权 · 审计</text>

    <rect x="1245" y="560" width="230" height="62" rx="14" fill="url(#card)" stroke="rgba(124,147,255,.28)"/>
    <text x="1360" y="589" text-anchor="middle" class="card-title">DSH agent</text>
    <text x="1360" y="607" text-anchor="middle" class="card-sub" data-en="her brain and sessions">她的大脑与会话</text>
  </svg>

  <footer class="legend">
    <div class="key">
      <span><i class="swatch"></i><em style="font-style:normal" data-en="solid = call">实线 = 调用</em></span>
      <span><i class="swatch dash"></i><em style="font-style:normal" data-en="dashed = event push">虚线 = 事件推送</em></span>
    </div>
    <span class="mark" data-en="0 AUTO-REPLY · EVERY SEND IS AUDITED">0 条自动外发 · 每次发送都过审计</span>
  </footer>
</div>
<script>
  if (new URLSearchParams(location.search).get('lang') === 'en') {
    document.body.dataset.lang = 'en';
    document.documentElement.lang = 'en';
    document.querySelectorAll('[data-en]').forEach(el => { el.textContent = el.dataset.en; });
  }
</script>
</body>
</html>
